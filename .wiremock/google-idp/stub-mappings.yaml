- id: "bc571e51-e324-4e51-bb6b-1fbd74df1b65"
  name: "Token"
  request:
    urlPathTemplate: "/token"
    method: "POST"
    bodyPatterns:
    - contains: "code="
  response:
    status: 200
    bodyFileName: "token-bc571e.json"
    headers:
      Content-Type: "application/json"
    transformers:
    - "response-template"
    - "rate-limit"
    transformerParameters:
      graphQlMockDataTransformerParameters: {}
  priority: 4
- id: "0d797c8b-0f54-4832-b9b7-3622761e906d"
  name: "Login handler"
  request:
    urlPathTemplate: "/login"
    method: "POST"
  response:
    status: 302
    bodyFileName: "login-handler-0d797c.txt"
    headers:
      Location: "{{formData request.body 'form' urlDecode=true}}{{#assign 'code'}}{{#base64\
        \ padding=false}}c={{form.clientId}}&s={{base64 form.email padding=false}}{{#contains\
        \ form.scopes.0 'email'}}&e={{form.email}}{{/contains}}{{#if form.nonce}}&n={{form.nonce}}{{/if}}{{#if\
        \ form.given_name}}&g={{form.given_name}}{{/if}}{{#if form.family_name}}&f={{form.family_name}}{{/if}}{{/base64}}{{/assign}}{{form.redirectUri}}?code={{urlEncode\
        \ code}}&state={{form.state}}"
    transformers:
    - "response-template"
    - "rate-limit"
    transformerParameters:
      graphQlMockDataTransformerParameters: {}
  priority: 4
