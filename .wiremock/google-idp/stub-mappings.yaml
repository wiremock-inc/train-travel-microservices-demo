---
mappings:
- id: "ffe52af6-57c6-4412-9d2c-6e839bc8158f"
  name: "Login page"
  request:
    urlPathTemplate: "/o/oauth2/v2/auth"
    method: "GET"
  response:
    status: 200
    bodyFileName: "login-page-ffe52a.txt"
    transformers:
    - "response-template"
    - "rate-limit"
    transformerParameters:
      rateLimitName: "authentication"
  priority: 3
