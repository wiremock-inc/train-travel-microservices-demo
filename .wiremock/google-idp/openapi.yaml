openapi: 3.0.3
info:
  title: Google Sign-In / OAuth 2.0 API
  description: |
    OpenAPI specification for Google Sign-In and OAuth 2.0 authentication endpoints.

    This API implements the OpenID Connect protocol for user authentication and OAuth 2.0
    for authorization. It allows applications to authenticate users with their Google accounts
    and obtain access tokens for accessing Google APIs.

    Note: Google does not publish an official OpenAPI specification. This specification
    was generated based on Google's OpenID Connect Discovery document and OAuth 2.0 documentation.
  version: "2.0"
  contact:
    name: Google Identity Platform
    url: https://developers.google.com/identity
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
- url: https://q1ooe.local.wiremock.cloud
- url: https://accounts.google.com
  description: Google Accounts (Authorization endpoints)
- url: https://oauth2.googleapis.com
  description: Google OAuth2 API (Token endpoints)
- url: https://openidconnect.googleapis.com
  description: Google OpenID Connect API (UserInfo endpoint)

tags:
- name: Discovery
  description: OpenID Connect Discovery endpoints
- name: Authorization
  description: OAuth 2.0 authorization endpoints
- name: Token
  description: Token management endpoints
- name: UserInfo
  description: User information endpoints
- name: Keys
  description: JSON Web Key Set endpoints

paths:
  /.well-known/openid-configuration:
    get:
      tags:
      - Discovery
      summary: OpenID Connect Discovery
      description: |
        Returns the OpenID Connect Discovery document containing metadata about
        Google's OAuth 2.0 authorization server, including endpoint URLs,
        supported scopes, claims, and authentication methods.
      operationId: getOpenIdConfiguration
      responses:
        '200':
          description: OpenID Connect configuration document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIdConfiguration'
              example:
                issuer: "https://accounts.google.com"
                authorization_endpoint: "https://accounts.google.com/o/oauth2/v2/auth"
                device_authorization_endpoint: "https://oauth2.googleapis.com/device/code"
                token_endpoint: "https://oauth2.googleapis.com/token"
                userinfo_endpoint: "https://openidconnect.googleapis.com/v1/userinfo"
                revocation_endpoint: "https://oauth2.googleapis.com/revoke"
                jwks_uri: "https://www.googleapis.com/oauth2/v3/certs"
                response_types_supported:
                - code
                - token
                - id_token
                - "code token"
                - "code id_token"
                - "token id_token"
                - "code token id_token"
                - none
                subject_types_supported:
                - public
                id_token_signing_alg_values_supported:
                - RS256
                scopes_supported:
                - openid
                - email
                - profile
                token_endpoint_auth_methods_supported:
                - client_secret_post
                - client_secret_basic
                claims_supported:
                - aud
                - email
                - email_verified
                - exp
                - family_name
                - given_name
                - iat
                - iss
                - name
                - picture
                - sub
                code_challenge_methods_supported:
                - plain
                - S256
                grant_types_supported:
                - authorization_code
                - refresh_token
                - "urn:ietf:params:oauth:grant-type:device_code"
                - "urn:ietf:params:oauth:grant-type:jwt-bearer"
  
  /o/oauth2/v2/auth:
    get:
      tags:
      - Authorization
      summary: Authorization Endpoint
      description: |
        Initiates the OAuth 2.0 authorization flow. This endpoint presents a login
        page to the user and, upon successful authentication, redirects back to
        the client application with an authorization code or tokens.
      operationId: authorize
      parameters:
      - name: client_id
        in: query
        required: true
        description: The OAuth 2.0 client ID obtained from the Google Cloud Console
        schema:
          type: string
        example: "123456789.apps.googleusercontent.com"
      - name: redirect_uri
        in: query
        required: true
        description: The URI to redirect to after authorization. Must match a registered redirect URI.
        schema:
          type: string
          format: uri
        example: "https://example.com/callback"
      - name: response_type
        in: query
        required: true
        description: |
          The type of response requested. Common values:
          - `code`: Authorization code flow (recommended)
          - `token`: Implicit flow (legacy)
          - `id_token`: OpenID Connect implicit flow
          - `code id_token`: Hybrid flow
        schema:
          type: string
          enum:
          - code
          - token
          - id_token
          - "code token"
          - "code id_token"
          - "token id_token"
          - "code token id_token"
        example: "code"
      - name: scope
        in: query
        required: true
        description: |
          Space-separated list of scopes. Must include `openid` for OIDC flows.
          Common scopes: `openid`, `email`, `profile`
        schema:
          type: string
        example: "openid email profile"
      - name: state
        in: query
        required: false
        description: An opaque value to maintain state between the request and callback. Recommended for CSRF protection.
        schema:
          type: string
        example: "xyz123"
      - name: nonce
        in: query
        required: false
        description: A random value to associate with the ID token for replay protection. Required when using implicit or hybrid flows.
        schema:
          type: string
        example: "abc456"
      - name: code_challenge
        in: query
        required: false
        description: PKCE code challenge for public clients
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        description: PKCE code challenge method
        schema:
          type: string
          enum:
          - plain
          - S256
      - name: prompt
        in: query
        required: false
        description: |
          Controls the authentication experience:
          - `none`: No UI shown, fails if user not authenticated
          - `consent`: Always show consent screen
          - `select_account`: Always show account selector
        schema:
          type: string
          enum:
          - none
          - consent
          - select_account
      - name: login_hint
        in: query
        required: false
        description: Email address or sub identifier to pre-fill the login form
        schema:
          type: string
      - name: access_type
        in: query
        required: false
        description: |
          Whether to return a refresh token:
          - `online`: No refresh token (default)
          - `offline`: Include refresh token
        schema:
          type: string
          enum:
          - online
          - offline
      responses:
        '200':
          description: Login page HTML (when user interaction required)
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect to callback URL with authorization code or tokens
          headers:
            Location:
              description: Redirect URL with code/tokens
              schema:
                type: string
                format: uri
  
  /token:
    post:
      tags:
      - Token
      summary: Token Endpoint
      description: |
        Exchanges an authorization code for access and ID tokens, or refreshes
        an existing access token using a refresh token.
      operationId: getToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  description: The type of grant being used
                  enum:
                  - authorization_code
                  - refresh_token
                  - "urn:ietf:params:oauth:grant-type:device_code"
                  - "urn:ietf:params:oauth:grant-type:jwt-bearer"
                code:
                  type: string
                  description: The authorization code (for authorization_code grant)
                redirect_uri:
                  type: string
                  format: uri
                  description: Must match the redirect_uri used in the authorization request
                client_id:
                  type: string
                  description: The OAuth 2.0 client ID
                client_secret:
                  type: string
                  description: The OAuth 2.0 client secret (for confidential clients)
                refresh_token:
                  type: string
                  description: The refresh token (for refresh_token grant)
                code_verifier:
                  type: string
                  description: PKCE code verifier (for public clients using PKCE)
              required:
              - grant_type
            examples:
              authorization_code:
                summary: Exchange authorization code for tokens
                value:
                  grant_type: authorization_code
                  code: "4/P7q7W91..."
                  redirect_uri: "https://example.com/callback"
                  client_id: "123456789.apps.googleusercontent.com"
                  client_secret: "your-client-secret"
              refresh_token:
                summary: Refresh an access token
                value:
                  grant_type: refresh_token
                  refresh_token: "1//xEoDL9..."
                  client_id: "123456789.apps.googleusercontent.com"
                  client_secret: "your-client-secret"
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: "ya29.a0AfH6SMB..."
                token_type: "Bearer"
                expires_in: 3600
                refresh_token: "1//xEoDL9..."
                scope: "openid email profile"
                id_token: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "invalid_grant"
                error_description: "The authorization code has expired."
        '401':
          description: Invalid client credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /v1/userinfo:
    get:
      tags:
      - UserInfo
      summary: UserInfo Endpoint
      description: |
        Returns claims about the authenticated user. The claims returned depend
        on the scopes requested during authorization.
      operationId: getUserInfo
      security:
      - bearerAuth: [
          ]
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
              example:
                sub: "110169484474386276334"
                email: "user@example.com"
                email_verified: true
                name: "John Doe"
                given_name: "John"
                family_name: "Doe"
                picture: "https://lh3.googleusercontent.com/a/..."
        '401':
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /oauth2/v3/certs:
    get:
      tags:
      - Keys
      summary: JSON Web Key Set
      description: |
        Returns the public keys used to verify ID token signatures.
        These keys are rotated periodically, so clients should cache them
        according to the HTTP cache headers.
      operationId: getJwks
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
              example:
                keys:
                - kty: "RSA"
                  alg: "RS256"
                  use: "sig"
                  kid: "1234567890"
                  n: "sXchDaQebSXKcvLF..."
                  e: "AQAB"
  
  /revoke:
    post:
      tags:
      - Token
      summary: Token Revocation Endpoint
      description: Revokes an access token or refresh token
      operationId: revokeToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: The token to revoke (access token or refresh token)
              required:
              - token
      responses:
        '200':
          description: Token successfully revoked
        '400':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /device/code:
    post:
      tags:
      - Authorization
      summary: Device Authorization Endpoint
      description: |
        Initiates the device authorization flow for devices with limited input
        capabilities (e.g., smart TVs, game consoles).
      operationId: deviceAuthorization
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: The OAuth 2.0 client ID
                scope:
                  type: string
                  description: Space-separated list of scopes
              required:
              - client_id
              - scope
      responses:
        '200':
          description: Device authorization response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
              example:
                device_code: "AH-1Ng..."
                user_code: "WDJB-MJHT"
                verification_url: "https://www.google.com/device"
                verification_uri: "https://www.google.com/device"
                expires_in: 1800
                interval: 5

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 access token
    
    oauth2:
      type: oauth2
      description: Google OAuth 2.0 authentication
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            openid: OpenID Connect scope for authentication
            email: Access to user's email address
            profile: Access to user's basic profile information
  
  schemas:
    OpenIdConfiguration:
      type: object
      description: OpenID Connect Discovery document
      properties:
        issuer:
          type: string
          format: uri
          description: The issuer identifier URL
        authorization_endpoint:
          type: string
          format: uri
          description: URL of the authorization endpoint
        device_authorization_endpoint:
          type: string
          format: uri
          description: URL of the device authorization endpoint
        token_endpoint:
          type: string
          format: uri
          description: URL of the token endpoint
        userinfo_endpoint:
          type: string
          format: uri
          description: URL of the userinfo endpoint
        revocation_endpoint:
          type: string
          format: uri
          description: URL of the token revocation endpoint
        jwks_uri:
          type: string
          format: uri
          description: URL of the JSON Web Key Set
        response_types_supported:
          type: array
          items:
            type: string
          description: List of supported response types
        subject_types_supported:
          type: array
          items:
            type: string
          description: List of supported subject types
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: List of supported ID token signing algorithms
        scopes_supported:
          type: array
          items:
            type: string
          description: List of supported scopes
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: List of supported client authentication methods
        claims_supported:
          type: array
          items:
            type: string
          description: List of supported claims
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          description: List of supported PKCE code challenge methods
        grant_types_supported:
          type: array
          items:
            type: string
          description: List of supported grant types
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - jwks_uri
      - response_types_supported
      - subject_types_supported
      - id_token_signing_alg_values_supported
    
    TokenResponse:
      type: object
      description: OAuth 2.0 token response
      properties:
        access_token:
          type: string
          description: The access token
        token_type:
          type: string
          description: The token type (always "Bearer")
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds
        refresh_token:
          type: string
          description: The refresh token (if offline access was requested)
        scope:
          type: string
          description: The scopes granted
        id_token:
          type: string
          description: The OpenID Connect ID token (JWT)
      required:
      - access_token
      - token_type
    
    UserInfo:
      type: object
      description: OpenID Connect UserInfo response
      properties:
        sub:
          type: string
          description: Subject identifier - unique user ID
        email:
          type: string
          format: email
          description: User's email address (requires email scope)
        email_verified:
          type: boolean
          description: Whether the email is verified
        name:
          type: string
          description: User's full name (requires profile scope)
        given_name:
          type: string
          description: User's first name (requires profile scope)
        family_name:
          type: string
          description: User's last name (requires profile scope)
        picture:
          type: string
          format: uri
          description: URL of user's profile picture (requires profile scope)
        locale:
          type: string
          description: User's locale
      required:
      - sub
    
    JwksResponse:
      type: object
      description: JSON Web Key Set response
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkKey'
      required:
      - keys
    
    JwkKey:
      type: object
      description: JSON Web Key
      properties:
        kty:
          type: string
          description: Key type (e.g., "RSA")
        alg:
          type: string
          description: Algorithm (e.g., "RS256")
        use:
          type: string
          description: Key use (e.g., "sig" for signature)
        kid:
          type: string
          description: Key ID
        n:
          type: string
          description: RSA modulus (base64url encoded)
        e:
          type: string
          description: RSA exponent (base64url encoded)
      required:
      - kty
      - kid
      - n
      - e
    
    DeviceAuthorizationResponse:
      type: object
      description: Device authorization response
      properties:
        device_code:
          type: string
          description: The device verification code
        user_code:
          type: string
          description: The user verification code to enter
        verification_url:
          type: string
          format: uri
          description: The URL for user verification (deprecated, use verification_uri)
        verification_uri:
          type: string
          format: uri
          description: The URL for user verification
        expires_in:
          type: integer
          description: Lifetime of the codes in seconds
        interval:
          type: integer
          description: Minimum polling interval in seconds
      required:
      - device_code
      - user_code
      - verification_uri
      - expires_in
    
    ErrorResponse:
      type: object
      description: OAuth 2.0 error response
      properties:
        error:
          type: string
          description: Error code
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
          - access_denied
          - expired_token
        error_description:
          type: string
          description: Human-readable error description
        error_uri:
          type: string
          format: uri
          description: URI with more information about the error
      required:
      - error
