server:
  port: 8080

spring:
  application:
    name: train-travel-gateway
  jackson:
    # The public Train Travel API is snake_case; downstream models override per-class
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          # Mocked Google IdP (WireMock Cloud, Google OAuth2 template). OIDC discovery gives us
          # the JWKS endpoint and issuer validation. Note: tokens must be issued via this exact
          # base URL, because the IdP mints `iss` from the request's own base URL.
          issuer-uri: https://<google-idp-mock-id>.wiremockapi.cloud
          # The bearer is an ID token, which is only meant for the client it was issued to:
          # `aud` must be the UI's OAuth client ID.
          audiences: train-travel-demo

traintravel:
  public-base-url: http://localhost:8080
  stations:
    base-url: https://<stations-mock-id>.wiremockapi.cloud
  trips:
    base-url: https://<trips-mock-id>.wiremockapi.cloud
  bookings:
    base-url: https://<bookings-mock-id>.wiremockapi.cloud
  payments:
    base-url: https://<payrail-mock-id>.wiremockapi.cloud/payrail/v1
  stripe:
    # Stripe API + hosted Checkout page (WireMock Cloud local environment `train-travel`)
    base-url: http://<stripe-mock-id>.local.wiremock.cloud
    secret-key: sk_test_train_travel_demo
    # Where the hosted Checkout page sends the browser back to: the UI
    return-base-url: http://localhost:3000
  webhook:
    url: https://<webhook-mock-id>.wiremockapi.cloud/new-booking
    timeout: 3s
  downstream:
    connect-timeout: 5s
    read-timeout: 10s